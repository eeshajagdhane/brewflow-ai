[project]
name = "brewflow-ai"
version = "0.1.0"
description = "An operations console for cafés: tools, RAG, and human review over simulated store data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "polars>=1.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "ipykernel>=6.29",
    "ipython>=8.0",
    "requests>=2.32",
    "pyarrow>=17",
    "mcp>=1.27.1",
    "flask>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "deepeval>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that make real network calls (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
